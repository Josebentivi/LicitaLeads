[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licita-lead-monitor"
version = "0.1.0"
description = "Monitor auditavel de oportunidades juridicas em contratacoes publicas"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "LicitaLead Monitor" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "holidays>=0.65,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
licita-lead = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
  "contract: offline contract tests",
  "live: opt-in tests that access official APIs",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/jobs/scheduler.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["ASYNC240", "B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"run.py" = ["S603", "S607"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/"]
